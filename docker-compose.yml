services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: llmops-litellm-gateway
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - ./gateway/litellm_config.yaml:/app/config.yaml:ro
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmops-sre-agent
    depends_on:
      litellm:
        condition: service_healthy
    environment:
      - LITELLM_PROXY_URL=http://litellm:4000/v1
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      - HF_HOME=/app/.hf_cache
      - HF_HUB_OFFLINE=1
    volumes:
      - ./.hf_cache:/app/.hf_cache:ro
    stdin_open: true
    tty: true
