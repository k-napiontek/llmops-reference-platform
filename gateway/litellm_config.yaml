model_list:
  - model_name: cloudops-llm
    litellm_params:
      model: openai/gpt-5.4-mini
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      max_completion_tokens: 1024

  - model_name: cloudops-fallback
    litellm_params:
      model: huggingface/Qwen/Qwen2.5-72B-Instruct
      api_key: os.environ/HF_TOKEN
      max_tokens: 1024

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 30
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
    - {"cloudops-llm": ["cloudops-fallback"]}

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
